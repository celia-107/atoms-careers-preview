<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Atoms · 淡彩蛋仔招聘海报</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeedeb;color:#585361;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.viewer{max-width:1600px;margin:auto;padding:26px 28px 35px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:19px}.title{font-size:15px;font-weight:550}.status{font-size:11px;color:#9a91a2;margin-top:6px}.actions{display:flex;gap:8px;align-items:center}.actions button,.actions a{font:inherit;font-size:12px;text-decoration:none;color:#74687f;background:#faf9f6;border:1px solid #dbd5df;border-radius:100px;padding:9px 14px;cursor:pointer}.actions button:hover,.actions a:hover{background:#e4dcec}.poster{position:relative;aspect-ratio:16/9;background:#faf9f6;overflow:hidden;border-radius:20px;box-shadow:0 22px 70px #4f3d5d10}.backdrop{position:absolute;inset:0;width:100%;height:100%;user-select:none}.mascot{position:absolute;height:auto;filter:drop-shadow(0 9px 8px #61547712);transform:rotate(var(--tilt));transform-origin:50% 85%;animation:bob 6s ease-in-out infinite;animation-delay:var(--delay);user-select:none}.poster.paused .mascot{animation-play-state:paused}.poster.no-motion .mascot{animation:none}.cta{position:absolute;left:6.35%;top:69.7%;width:15.55%;height:7.6%;border-radius:100px;outline-offset:5px}.cta:hover{box-shadow:0 0 0 3px #b7a6c57a}.cta:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #b194c9}.caption{font-size:12px;color:#98909d;text-align:center;line-height:1.9;margin:20px auto 0}.caption a{color:#776183}.sr-only{position:absolute;clip-path:inset(50%);height:1px;width:1px;overflow:hidden;white-space:nowrap}@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--tilt))}50%{transform:translateY(calc(var(--lift)*-1)) rotate(calc(var(--tilt) + 3deg))}}@media(prefers-reduced-motion:reduce){.mascot{animation:none}}@media(max-width:680px){.viewer{padding:22px 12px}.toolbar{align-items:flex-start;gap:12px}.actions{flex-wrap:wrap;justify-content:flex-end}.actions a,.actions button{font-size:10px;padding:8px 11px}.title{font-size:13px}.status{font-size:10px}.poster{border-radius:10px}.caption{font-size:11px}}
</style></head><body><main class="viewer"><div class="toolbar"><div><div class="title">Atoms · 招聘主视觉</div><div class="status">奶油白 / 雾紫 / 浅薄荷 · 轻动态版</div></div><div class="actions"><button id="motion" type="button" aria-pressed="false">暂停动画</button><a download href="atoms-recruitment-poster.png">下载静态图</a><a download href="atoms-recruitment-motion.gif">下载动图</a></div></div><section class="poster" id="poster" aria-label="Atoms 招聘海报：好想法，一起做出来。七位蛋仔伙伴在柔和的浅色背景上轻轻摇摆跳跃。"><img class="backdrop" src="assets/poster-background.png" alt="" /><img class="mascot" src="assets/IP-8-cutout.png" style="left:55.03571%;top:22.77778%;width:11.38691%;--tilt:8deg;--delay:-0.000s;--lift:10px" alt="" /><img class="mascot" src="assets/IP-20-cutout.png" style="left:67.56900%;top:15.27778%;width:11.84116%;--tilt:-6deg;--delay:-1.146s;--lift:15px" alt="" /><img class="mascot" src="assets/IP-38-cutout.png" style="left:82.53198%;top:27.22222%;width:12.74854%;--tilt:9deg;--delay:-2.005s;--lift:11px" alt="" /><img class="mascot" src="assets/IP-2-cutout.png" style="left:47.82952%;top:49.44444%;width:13.50762%;--tilt:-8deg;--delay:-1.528s;--lift:12px" alt="" /><img class="mascot" src="assets/IP-14-cutout.png" style="left:59.17795%;top:51.11111%;width:14.03994%;--tilt:5deg;--delay:-2.769s;--lift:10px" alt="" /><img class="mascot" src="assets/IP-26-cutout.png" style="left:69.21212%;top:45.09259%;width:19.70077%;--tilt:-8deg;--delay:-3.533s;--lift:15px" alt="" /><img class="mascot" src="assets/IP-32-cutout.png" style="left:84.03646%;top:52.12963%;width:13.90625%;--tilt:7deg;--delay:-4.584s;--lift:12px" alt="" /><a class="cta" href="../#jobs" aria-label="查看岗位，返回招聘页面"></a><div class="sr-only"><h1>好想法，一起做出来。</h1><p>和 AI 一起，把灵感变成可用的产品。带着好奇心，也带着你的作品。</p><p>理解真实问题 · 借助 AI 交付 · 主动验证迭代。</p></div></section><p class="caption">保留原角色形象，用错落站位、轻微弹跳和摇摆增加活泼感。<br>招聘页面与岗位详情已提供交互预览；内容为示例。<a href="../#jobs">返回招聘页</a></p></main><script>
const btn=document.getElementById('motion'),poster=document.getElementById('poster');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced){poster.classList.add('no-motion');btn.disabled=true;btn.textContent='已遵循减少动态设置'}btn.addEventListener('click',()=>{const paused=poster.classList.toggle('paused');btn.textContent=paused?'播放动画':'暂停动画';btn.setAttribute('aria-pressed',String(paused))});
</script></body></html>
